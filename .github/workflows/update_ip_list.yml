# 每10分钟运行一次 scrape_uouin.py，并将更新后的结果提交回仓库。

name: 更新优选IP列表

on:
  schedule:
    # 每小时第 7、17、27、37、47、57 分钟运行，避开整点调度高峰。
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 抓取并生成优选IP列表
        run: python scrape_uouin.py

      - name: 提交更新（没有变化就跳过）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/uouin.txt
          git diff --staged --quiet || git commit -m "更新优选IP列表 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
